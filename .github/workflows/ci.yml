name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pnpm build
      - run: pnpm exec playwright-core install --with-deps chromium-headless-shell
        working-directory: packages/renderer
      - run: pnpm typecheck
      - run: pnpm test:unit
      - name: Generated docs are up to date
        run: pnpm run docs:gen && git diff --exit-code -- docs/
      - run: pnpm test:golden
        env:
          DW_CDP_TRACE: "1"
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-actual
          path: tests/golden/__actual__
